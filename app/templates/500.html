{% extends "base.html" %}

{% block title %}Server Error - Jira Migration{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="bi bi-gear text-danger" style="font-size: 5rem;"></i>
                    </div>
                    <h1 class="display-4 fw-bold text-muted">500</h1>
                    <h2 class="mb-3">Something Went Wrong</h2>
                    <p class="text-muted mb-4">
                        We're sorry, but something unexpected happened on our end. 
                        Please try again later or contact support if the problem persists.
                    </p>
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door me-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
