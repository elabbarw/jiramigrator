{% extends "base.html" %}

{% block title %}Jobs - Jira Migration{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h1>Migration Jobs</h1>
        <p class="text-muted mb-0">View and manage all migration jobs</p>
    </div>
    <a href="/migrate" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> New Migration
    </a>
</div>

<!-- Filters -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="running">Running</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Export Method</label>
                <select class="form-select" id="methodFilter">
                    <option value="">All Methods</option>
                    <option value="sharepoint">SharePoint</option>
                    <option value="api">API</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Limit</label>
                <select class="form-select" id="limitFilter">
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="loadJobs()">
                    <i class="bi bi-search"></i> Filter
                </button>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" onclick="resetFilters()">
                    <i class="bi bi-x-lg"></i> Reset
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Jobs Table -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Export Method</th>
                        <th>Query</th>
                        <th>Progress</th>
                        <th>Created</th>
                        <th>Duration</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobsTable">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">
                            <div class="spinner-border spinner-border-sm" role="status"></div>
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav id="pagination" class="mt-3" style="display: none;">
            <ul class="pagination justify-content-center mb-0">
            </ul>
        </nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentOffset = 0;
    let totalJobs = 0;

    $(document).ready(function() {
        loadJobs();
    });

    function loadJobs() {
        const status = $('#statusFilter').val();
        const method = $('#methodFilter').val();
        const limit = parseInt($('#limitFilter').val());
        
        let url = `/api/jobs/?limit=${limit}&offset=${currentOffset}`;
        if (status) url += `&status=${status}`;
        if (method) url += `&export_method=${method}`;
        
        $.get(url, function(data) {
            totalJobs = data.total;
            renderJobs(data.jobs);
            renderPagination(data.total, limit);
        }).fail(function() {
            $('#jobsTable').html('<tr><td colspan="8" class="text-center text-muted py-4">Failed to load jobs</td></tr>');
        });
    }

    function renderJobs(jobs) {
        if (!jobs || jobs.length === 0) {
            $('#jobsTable').html('<tr><td colspan="8" class="text-center text-muted py-4">No jobs found</td></tr>');
            $('#pagination').hide();
            return;
        }
        
        let html = '';
        jobs.forEach(job => {
            const statusBadge = getStatusBadge(job.status);
            const created = new Date(job.created_at).toLocaleString();
            const query = job.jql ? truncate(job.jql, 30) : job.project_key || '-';
            const progress = job.total_issues > 0 
                ? `${job.processed_issues}/${job.total_issues} (${Math.round(job.processed_issues/job.total_issues*100)}%)`
                : '-';
            const duration = job.completed_at && job.started_at 
                ? formatDuration(new Date(job.completed_at) - new Date(job.started_at))
                : '-';
            
            html += `
                <tr>
                    <td><a href="/jobs/${job.id}">#${job.id}</a></td>
                    <td>${statusBadge}</td>
                    <td><span class="text-capitalize">${job.export_method}</span></td>
                    <td><code title="${job.jql || ''}">${query}</code></td>
                    <td>
                        ${job.total_issues > 0 ? `
                        <div class="d-flex align-items-center">
                            <div class="progress flex-grow-1" style="height: 6px; width: 80px;">
                                <div class="progress-bar ${job.status === 'failed' ? 'bg-danger' : ''}" 
                                     style="width: ${job.total_issues > 0 ? Math.round(job.processed_issues/job.total_issues*100) : 0}%"></div>
                            </div>
                            <small class="ms-2 text-muted">${job.successful_issues}/${job.total_issues}</small>
                        </div>
                        ` : '<span class="text-muted">-</span>'}
                    </td>
                    <td><small>${created}</small></td>
                    <td><small>${duration}</small></td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a href="/jobs/${job.id}" class="btn btn-outline-primary" title="View Details">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a href="/logs/${job.id}" class="btn btn-outline-secondary" title="View Logs">
                                <i class="bi bi-file-text"></i>
                            </a>
                            ${job.status === 'running' || job.status === 'pending' || job.status === 'started' ? `
                            <button class="btn btn-outline-danger" onclick="cancelJob(${job.id})" title="Stop Job">
                                <i class="bi bi-stop-fill"></i>
                            </button>
                            ` : ''}
                            ${(job.status === 'failed' || job.status === 'completed' || job.status === 'cancelled') && (job.failed_issues > 0 || (job.total_issues > 0 && job.processed_issues < job.total_issues)) ? `
                            <button class="btn btn-outline-warning" onclick="resumeJob(${job.id})" title="Resume (retry failed/unprocessed issues)">
                                <i class="bi bi-play-fill"></i>
                            </button>
                            ` : ''}
                            ${job.status === 'failed' || job.status === 'completed' || job.status === 'cancelled' ? `
                            <button class="btn btn-outline-info" onclick="restartJob(${job.id})" title="Restart Job">
                                <i class="bi bi-arrow-repeat"></i>
                            </button>
                            ` : ''}
                            ${job.status !== 'running' && job.status !== 'pending' && job.status !== 'started' ? `
                            <button class="btn btn-outline-secondary" onclick="deleteJob(${job.id})" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `;
        });
        $('#jobsTable').html(html);
    }

    function renderPagination(total, limit) {
        const totalPages = Math.ceil(total / limit);
        const currentPage = Math.floor(currentOffset / limit) + 1;
        
        if (totalPages <= 1) {
            $('#pagination').hide();
            return;
        }
        
        let html = '';
        
        // Previous button
        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">Previous</a>
        </li>`;
        
        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
                </li>`;
            } else if (i === currentPage - 3 || i === currentPage + 3) {
                html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
            }
        }
        
        // Next button
        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">Next</a>
        </li>`;
        
        $('#pagination ul').html(html);
        $('#pagination').show();
    }

    function goToPage(page) {
        const limit = parseInt($('#limitFilter').val());
        currentOffset = (page - 1) * limit;
        loadJobs();
        return false;
    }

    function resetFilters() {
        $('#statusFilter').val('');
        $('#methodFilter').val('');
        $('#limitFilter').val('50');
        currentOffset = 0;
        loadJobs();
    }

    function deleteJob(jobId) {
        if (!confirm('Are you sure you want to delete this job?')) return;
        
        $.ajax({
            url: `/api/jobs/${jobId}`,
            method: 'DELETE',
            success: function() {
                loadJobs();
            },
            error: function(xhr) {
                alert('Failed to delete job: ' + (xhr.responseJSON?.detail || 'Unknown error'));
            }
        });
    }

    function cancelJob(jobId) {
        if (!confirm('Stop this job? This will terminate the migration process.')) return;
        
        $.post(`/api/jobs/${jobId}/cancel`)
            .done(function(response) {
                showSuccess('Job stopped successfully');
                loadJobs();
            })
            .fail(function(xhr) {
                showError('Failed to stop job: ' + (xhr.responseJSON?.detail || 'Unknown error'));
            });
    }

    function restartJob(jobId) {
        if (!confirm('Restart this job from scratch? All issues will be processed again.')) return;
        
        $.post(`/api/jobs/${jobId}/restart`)
            .done(function(response) {
                showSuccess(`Job restarted! New job ID: ${response.new_job_id}`);
                window.location.href = `/jobs/${response.new_job_id}`;
            })
            .fail(function(xhr) {
                showError('Failed to restart job: ' + (xhr.responseJSON?.detail || 'Unknown error'));
            });
    }

    function resumeJob(jobId) {
        if (!confirm('Resume this job? Failed and unprocessed issues will be retried.')) return;
        
        $.post(`/api/jobs/${jobId}/resume`)
            .done(function(response) {
                let msg = `Job resumed! New job ID: ${response.new_job_id}`;
                if (response.failed_issues > 0) msg += ` (${response.failed_issues} failed`;
                if (response.unprocessed_issues > 0) msg += response.failed_issues > 0 ? `, ${response.unprocessed_issues} pending)` : ` (${response.unprocessed_issues} pending)`;
                else if (response.failed_issues > 0) msg += ')';
                showSuccess(msg);
                window.location.href = `/jobs/${response.new_job_id}`;
            })
            .fail(function(xhr) {
                showError('Failed to resume job: ' + (xhr.responseJSON?.detail || 'Unknown error'));
            });
    }

    function getStatusBadge(status) {
        const badges = {
            'pending': '<span class="badge bg-secondary">Pending</span>',
            'started': '<span class="badge bg-primary">Started</span>',
            'running': '<span class="badge bg-info">Running</span>',
            'completed': '<span class="badge bg-success">Completed</span>',
            'failed': '<span class="badge bg-danger">Failed</span>'
        };
        return badges[status] || `<span class="badge bg-secondary">${status}</span>`;
    }

    function truncate(str, len) {
        if (!str) return '';
        return str.length > len ? str.substring(0, len) + '...' : str;
    }

    function formatDuration(ms) {
        if (ms < 0) return '-';
        const seconds = Math.floor(ms / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        
        if (hours > 0) {
            return `${hours}h ${minutes % 60}m`;
        } else if (minutes > 0) {
            return `${minutes}m ${seconds % 60}s`;
        } else {
            return `${seconds}s`;
        }
    }
</script>
{% endblock %}
